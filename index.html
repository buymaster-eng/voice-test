<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>声で記録の試し</title>
<style>
:root{--bg:#f3f5f4;--card:#ffffff;--fg:#1b2320;--muted:#5a6661;--line:#cbd4cf;--accent:#1d5d70;--accent-fg:#ffffff;--ok:#2f7a4a;--ok-bg:#e2f1e7;--warn:#9a6514;--warn-bg:#f6ead2;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#121816;--card:#1b2320;--fg:#e4ebe8;--muted:#9fb0a9;--line:#34423d;--accent:#7fc3d6;--accent-fg:#0c1a1f;--ok:#7fcf9c;--ok-bg:#1c3326;--warn:#e3b25e;--warn-bg:#3a2d16;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;line-height:1.6}
main{max-width:520px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 32px;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.15rem;margin:0}
.note{font-size:.85rem;color:var(--muted);margin:0}
#talk{appearance:none;border:0;border-radius:999px;width:180px;height:180px;align-self:center;background:var(--accent);color:var(--accent-fg);font-size:1.4rem;font-weight:bold;cursor:pointer}
#talk.listening{background:var(--warn);color:#fff}
#talk:focus-visible{outline:3px solid var(--fg);outline-offset:4px}
#status{text-align:center;min-height:1.6em;margin:0;font-weight:bold}
#interim{text-align:center;min-height:1.6em;margin:0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.card.ok{border-color:var(--ok);background:var(--ok-bg)}
.card .kind{font-size:.8rem;color:var(--muted)}
.card .text{font-size:1.05rem;font-weight:bold}
#log{display:flex;flex-direction:column;gap:8px}
#warn{background:var(--warn-bg);border:1px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>声で記録の試し</h1>
<p class="note">ボタンを押して「A社の請求書づくり開始」のように話してください。話し終わると<b>自動で送信</b>され、復唱します。これは試しの画面で、記録はどこにも保存しません（画面を閉じると消えます）。</p>
<div id="warn" hidden></div>
<button id="talk" type="button" aria-live="polite">話す</button>
<p id="status">ボタンを押して話してください</p>
<p id="interim"></p>
<div id="log"></div>
</main>
<script>
(function(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var btn = document.getElementById('talk');
  var st = document.getElementById('status');
  var im = document.getElementById('interim');
  var log = document.getElementById('log');
  var warn = document.getElementById('warn');
  var tapAt = 0, busy = false;
  var standalone = (window.navigator.standalone === true) || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (!SR) {
    warn.hidden = false;
    warn.textContent = 'このブラウザでは声の入力が使えません。iPhone は Safari、Android は Chrome で開いてください。';
    btn.disabled = true; return;
  }
  if (standalone) {
    warn.hidden = false;
    warn.textContent = 'ホーム画面の「アプリ表示」では声の入力が止まることがあります（iPhone）。うまく動かない時は Safari で開いてください。';
  }
  var KINDS = [['取り消し','取り消し'],['取消','取り消し'],['開始','開始'],['終了','終了'],['中断','中断'],['再開','再開']];
  function parse(t){
    var s = t.replace(/[。．\s]+$/,'');
    for (var i=0;i<KINDS.length;i++){
      var k = KINDS[i][0];
      if (s.slice(-k.length) === k){
        var body = s.slice(0, s.length - k.length).replace(/[のを、\s]+$/,'');
        return {kind: KINDS[i][1], body: body};
      }
    }
    return {kind: '（分からない）', body: s};
  }
  function hhmm(d){ return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
  function say(text){
    try { var u = new SpeechSynthesisUtterance(text); u.lang = 'ja-JP'; window.speechSynthesis.speak(u); } catch(e) {}
  }
  function send(text){
    var now = new Date();
    var p = parse(text);
    var secs = ((Date.now() - tapAt)/1000).toFixed(1);
    var card = document.createElement('div');
    card.className = 'card ok';
    var k = document.createElement('span'); k.className='kind';
    k.textContent = '送信しました（試し）｜' + hhmm(now) + '｜押してから ' + secs + ' 秒';
    var tx = document.createElement('span'); tx.className='text';
    tx.textContent = (p.body ? p.body + '｜' : '') + p.kind;
    var raw = document.createElement('span'); raw.className='kind';
    raw.textContent = '話した文：' + text;
    card.appendChild(k); card.appendChild(tx); card.appendChild(raw);
    log.insertBefore(card, log.firstChild);
    st.textContent = '記録しました';
    say((p.body ? p.body + '、' : '') + p.kind + '、' + hhmm(now) + 'で記録しました');
  }
  function start(){
    if (busy) return;
    var rec = new SR();
    rec.lang = 'ja-JP'; rec.continuous = false; rec.interimResults = true; rec.maxAlternatives = 1;
    var finalText = '';
    rec.onstart = function(){ busy = true; btn.classList.add('listening'); btn.textContent = '聞いています'; st.textContent = '話してください'; im.textContent=''; };
    rec.onresult = function(ev){
      var interim = '';
      for (var i = ev.resultIndex; i < ev.results.length; i++){
        if (ev.results[i].isFinal) finalText += ev.results[i][0].transcript;
        else interim += ev.results[i][0].transcript;
      }
      im.textContent = finalText + interim;
    };
    rec.onerror = function(ev){
      st.textContent = (ev.error === 'not-allowed') ? 'マイクが許可されていません（設定でマイクを許可してください）' : (ev.error === 'no-speech' ? '声が聞こえませんでした。もう一度どうぞ' : '聞き取れませんでした（' + ev.error + '）');
    };
    rec.onend = function(){
      busy = false; btn.classList.remove('listening'); btn.textContent = '話す';
      var t = (finalText || im.textContent || '').trim();
      if (t) { send(t); im.textContent=''; } else if (st.textContent === '話してください') { st.textContent = '声が聞こえませんでした。もう一度どうぞ'; }
    };
    try { rec.start(); } catch(e) { st.textContent = '始められませんでした。もう一度押してください'; }
  }
  btn.addEventListener('click', function(){ tapAt = Date.now(); start(); });
})();
</script>
</body>
</html>
